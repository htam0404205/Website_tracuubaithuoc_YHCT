<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Quản trị Bản Thảo'">Quản trị</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar__brand">
        <div class="logo-row">
            <div class="logo">B</div>
            <div>
                <h1>Bản Thảo</h1>
            </div>
        </div>
        <span>Y học cổ truyền</span>
    </div>
    <nav aria-label="Menu quản trị">
        <p style="font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 4px;margin:0;">KHÔNG GIAN QUẢN TRỊ</p>
        <a th:href="@{/admin}"          th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="nav-icon">⊞</span> Tổng quan
        </a>
        <a th:href="@{/admin/bai-thuoc}" th:classappend="${active == 'baithuoc'} ? 'active'">
            <span class="nav-icon">📖</span> Bài thuốc
        </a>
        <a th:href="@{/admin/vi-thuoc}"  th:classappend="${active == 'vithuoc'} ? 'active'">
            <span class="nav-icon">🌿</span> Vị thuốc
        </a>
        <a th:href="@{/admin/lien-ket}"  th:classappend="${active == 'lienket'} ? 'active'">
            <span class="nav-icon">🔗</span> Thành phần bài thuốc
        </a>
    </nav>
    <div class="sidebar__info">
        <strong>🛡 Dữ liệu có nguồn gốc</strong>
        Luôn kiểm tra văn bản nguồn trước khi cập nhật.
    </div>
    <div class="sidebar__foot">
        <a th:href="@{/}" target="_blank"><span>↗</span> Website tra cứu</a>
        <form th:action="@{/admin/logout}" method="post" style="margin:0;">
            <button type="submit"><span>⏻</span> Đăng xuất</button>
        </form>
    </div>
</aside>

<div th:fragment="topbar">
    <div class="admin-topbar-row">
        <div class="breadcrumb" th:replace="${breadcrumbFrag ?: ''}"></div>
        <div class="right-actions">
            <a th:href="@{/}" target="_blank" style="font-size:.82rem;color:var(--muted);text-decoration:none;">↗ Website tra cứu</a>
            <div class="admin-user">
                <div class="avatar">QT</div>
                <span style="font-size:.82rem;">Quản trị viên</span>
            </div>
        </div>
    </div>
</div>

<div th:fragment="flash">
    <div class="alert-error" th:if="${loi}"      th:text="${loi}"      role="alert"></div>
    <div class="notice"      th:if="${thongBao}" th:text="${thongBao}" role="status" style="margin-bottom:16px;"></div>
</div>

</body>
</html>
